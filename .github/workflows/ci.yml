name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m src.rag_platform.cli ingest examples/knowledge
      - run: python -m src.rag_platform.cli evaluate evaluation/golden_set.json
      - run: python -m src.rag_platform.cli experiment evaluation/candidate_test_set.json --repeats 2 --output /tmp/local-experiment.json
      - run: python -m src.rag_platform.cli security-evaluate evaluation/security_robustness_v2.json
      - run: ruff check src tests
      - run: pytest
      - run: docker build -t enterprise-rag:test .
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm
      - run: helm template enterprise-rag deploy/helm > /tmp/rendered.yaml
